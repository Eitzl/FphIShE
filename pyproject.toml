[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fphishe"
version = "0.1.0"
description = "Fast protein-homolog Indexed Search Engine: embedding prefilter + Smith-Waterman rerank"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Evan Fitzhugh" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "faiss-cpu",
    "h5py",
    "biopython",
    "matplotlib",
]

[project.optional-dependencies]
align = ["parasail"]
gpu = ["numba"]
embed = ["torch", "transformers", "sentencepiece", "protobuf"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
